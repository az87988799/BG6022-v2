name: offline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --offline --no-sync python -c "import sqlite3; print(f'SQLite {sqlite3.sqlite_version}')"
      - run: uv run --offline --no-sync python -m compileall -q src tests
      - run: uv run --offline --no-sync pytest
      - name: Ubuntu branch coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: >-
          uv run --offline --no-sync pytest
          --cov=orca_agent
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=80

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --python 3.14
      - run: uv run --offline --no-sync python -c "import sqlite3; print(f'SQLite {sqlite3.sqlite_version}')"
      - run: uv lock --check
      - name: Check changed-file whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" --
      - run: uv run --offline --no-sync ruff check .
      - run: uv run --offline --no-sync ruff format --check .
      - run: uv build
